<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实现纲要 — 交互式代码结构蓝图</title>
<!-- 路径已设为技能目录下的绝对 file:// 路径，拷贝模板后无需修改 -->
<link rel="stylesheet" href="file:///C:/Users/QWERTYUIOP/.agents/skills/实现纲要/templates/styles.css">
</head>
<body>

<!-- 所有 UI 元素由 engine-v3.js 的 初始化UI() 动态填充，此处只保留容器骨架 -->
<div id="focus-bar"></div>
<div id="step-indicator"></div>
<div id="filter-bar"></div>

<div id="canvas-container">
  <div id="g6-canvas"></div>
  <div id="empty-state" style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; color:var(--text-muted); pointer-events:none; z-index:10;"></div>
  <div id="legend"></div>
  <div id="toast"></div>
  <div id="touch-hint"></div>
  <div id="legend-tooltip"></div>
  <div id="context-menu"></div>
  <div id="inline-popover"></div>
  <div id="panel-resizer"></div>
  <div id="type-panel"></div>
</div>

<!-- 🔴 禁止修改以下 script 标签的 src 路径！使用绝对 file:/// 路径确保 G6 和引擎在任何目录都能加载。改为相对路径会导致浏览器验证失败。 -->
<!-- AntV G6 v5（本地文件，无需网络） -->
<script src="file:///C:/Users/QWERTYUIOP/.agents/skills/实现纲要/templates/g6.min.js"
        onerror="console.error('❌ G6 加载失败——请检查文件路径')"></script>

<!-- 引擎 -->
<script src="file:///C:/Users/QWERTYUIOP/.agents/skills/实现纲要/templates/engine-v3.js"></script>

<!-- ==================== 工作数据（自动加载同名 .data.js）==================== -->
<!-- HTML 是静态壳，不在此处写入数据。
     使用时将此 HTML 拷贝为 实现纲要-{项目名}.html，
     同时将 data.template.js 拷贝为 实现纲要-{项目名}.data.js，
     在 .data.js 的 执行工作数据() 函数中编写 API 调用。
     HTML 会自动加载同名的 .data.js 并执行 执行工作数据()。 -->
<script>
(function() {
    // 从当前 HTML 文件名推导出同名 .data.js 路径
    var scripts = document.querySelectorAll('script[src]');
    var htmlSrc = '';
    try { htmlSrc = document.currentScript && document.currentScript.src || location.href; } catch(e) {}
    // 构造 .data.js 的加载路径：与 HTML 同目录，文件名 .html → .data.js
    var dataPath = location.href.replace(/\.html$/, '.data.js');
    var script = document.createElement('script');
    script.src = dataPath;
    script.onerror = function() {
        console.error('❌ 未找到同名 .data.js 文件: ' + dataPath);
        console.error('请确保 .data.js 文件与 HTML 在同一目录，且文件名对应。');
    };
    document.head.appendChild(script);
})();
</script>

<!-- ==================== 🔴 错误拦截层（禁止删除）==================== -->
<!-- 此 <script> 块负责捕获工作数据区中所有 API 调用抛出的参数错误。
     当 AI 调用引擎 API 时参数错误（如职责描述/需求条目顺序颠倒），
     engine-v3.js 会 throw 实现纲要APIError，被此处捕获后显示红色全屏覆盖层，
     提示 AI 重新查看 API 文档。绝不修改或删除此 <script> 块。 -->
<script>
// 延迟执行，等待 .data.js 加载完毕
window.addEventListener('load', function() {
    try {
        if (typeof 执行工作数据 === 'function') {
            执行工作数据();
        } else {
            console.error('❌ 执行工作数据() 函数未定义——请检查 .data.js 文件');
        }
    } catch (err) {
        var isAPIError = (typeof window.实现纲要APIError !== 'undefined') && (err instanceof window.实现纲要APIError);
        var msg = isAPIError ? err.message : ('[工作数据执行失败] ' + (err.message || err.toString()));

        document.body.innerHTML =
            '<div style="display:flex;align-items:center;justify-content:center;height:100vh;' +
            'background:#fff0f0;color:#c0392b;font-family:-apple-system,BlinkMacSystemFont,' +
            '"Segoe UI",Roboto,sans-serif;padding:40px;text-align:center">' +
            '<div style="max-width:700px">' +
            '<div style="font-size:32px;margin-bottom:12px">&#x1f6d1;</div>' +
            '<h2 style="font-size:24px;margin:0 0 8px;color:#c0392b">API 参数错误</h2>' +
            '<p style="font-size:15px;margin:0 0 16px;color:#8b0000;line-height:1.8">' +
            '<code style="background:#ffe0e0;padding:8px 12px;border-radius:6px;display:block;' +
            'text-align:left;font-size:13px;word-break:break-word;line-height:1.6;margin-top:12px">' +
            (msg.replace(/</g,'&lt;').replace(/>/g,'&gt;')) +
            '</code>' +
            '</p>' +
            '<p style="font-size:14px;color:#8b0000;margin:16px 0 8px;font-weight:600">请检查上面的错误提示，修正 .data.js 中的 API 调用</p>' +
            '<p style="font-size:13px;color:#888;margin:0">错误堆栈: <code style="color:#666">' +
            ((err.stack || '').replace(/</g,'&lt;').replace(/>/g,'&gt;').substring(0,500)) +
            '</code></p>' +
            '</div></div>';

        window.阻止渲染 = true;
        throw err;
    }
});
</script>
</body>
</html>
